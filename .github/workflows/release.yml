name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Conferir feed e credencial
        env:
          NUGET_SOURCE_URL: ${{ vars.NUGET_SOURCE_URL }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_SOURCE_URL" ] || [ -z "$NUGET_API_KEY" ]; then
            echo "Defina a variable NUGET_SOURCE_URL e o secret NUGET_API_KEY neste repositório."
            exit 1
          fi

      - run: dotnet test MB.ScopedDataSync.slnx

      - name: Versão a partir da tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - run: dotnet pack MB.ScopedDataSync.slnx -c Release -p:Version=${{ steps.version.outputs.value }} -p:GeneratePackageOnBuild=false -o ./artifacts

      - name: Publicar pacotes
        env:
          NUGET_SOURCE_URL: ${{ vars.NUGET_SOURCE_URL }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "./artifacts/*.nupkg" --source "$NUGET_SOURCE_URL" --api-key "$NUGET_API_KEY" --skip-duplicate
